<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaCave - Connexion</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        netflixRed: '#E50914',
                        netflixRedHover: '#F6121D',
                        darkBg: '#141414',
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="h-full bg-black text-white antialiased selection:bg-netflixRed selection:text-white">
    <div id="appMountPoint" class="min-h-full flex flex-col relative">
        
        <!-- Atmospheric Background with Vignette Overlay (Simulated via high-res gradient & background image) -->
        <div class="absolute inset-0 z-0 bg-cover bg-center opacity-50 pointer-events-none" 
             style="background-image: url('https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?q=80&w=1920&auto=format&fit=crop');">
        </div>
        <!-- Dark gradient overlay for depth -->
        <div class="absolute inset-0 z-0 bg-gradient-to-t from-black via-black/40 to-black/60 pointer-events-none"></div>

        <header class="relative z-10 w-full px-6 md:px-12 py-6 max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="#" class="text-3xl font-bold tracking-wider text-netflixRed uppercase">MaCave</a>
            </div>
        </header>

        <main class="relative z-10 flex-grow flex items-center justify-center px-4 py-8">
            <div class="w-full max-w-md bg-black/75 backdrop-blur-md p-8 md:p-16 rounded-xl shadow-2xl border border-white/10">
                <h1 class="text-3xl font-bold mb-8 text-white">Connexion</h1>
                
                <form id="loginForm" class="space-y-6" onsubmit="handleLogin(event)">
                    <div>
                        <div class="relative">
                            <input type="text" id="email" required 
                                   class="peer w-full px-4 pt-6 pb-2 bg-[#333] text-white rounded-lg focus:outline-none focus:bg-[#454545] focus:ring-2 focus:ring-netflixRed placeholder-transparent transition-all"
                                   placeholder="Email">
                            <label for="email" class="absolute text-xs text-zinc-400 left-4 top-2 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-zinc-400 peer-placeholder-shown:top-4 peer-focus:top-2 peer-focus:text-xs peer-focus:text-zinc-300">
                                Email
                            </label>
                        </div>
                    </div>

                    <div>
                        <div class="relative">
                            <input type="password" id="password" required 
                                   class="peer w-full px-4 pt-6 pb-2 bg-[#333] text-white rounded-lg focus:outline-none focus:bg-[#454545] focus:ring-2 focus:ring-netflixRed placeholder-transparent transition-all"
                                   placeholder="Mot de passe">
                            <label for="password" class="absolute text-xs text-zinc-400 left-4 top-2 transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-zinc-400 peer-placeholder-shown:top-4 peer-focus:top-2 peer-focus:text-xs peer-focus:text-zinc-300">
                                Mot de passe
                            </label>
                        </div>
                    </div>

                    <div>
                        <button type="submit" 
                                class="w-full py-3.5 px-4 bg-netflixRed hover:bg-netflixRedHover text-white font-semibold rounded-lg shadow-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-netflixRed">
                            Se connecter
                        </button>
                    </div>

                    <div class="flex items-center justify-between text-xs text-zinc-400">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="rounded bg-[#333] border-zinc-600 text-netflixRed focus:ring-0">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#" class="hover:underline hover:text-zinc-300">Besoin d'aide ?</a>
                    </div>
                </form>

                <div class="mt-16 text-zinc-400 text-sm">
                    <p>Première visite sur MaCave ? <a href="macave_signup.html" class="text-white font-medium hover:underline">Inscrivez-vous.</a></p>
                </div>
            </div>
        </main>

        <footer class="relative z-10 w-full bg-black/80 text-zinc-500 text-xs py-8 px-6 md:px-12 border-t border-white/5 mt-auto">
            <div class="max-w-7xl mx-auto flex flex-col space-y-4">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 underline">
                    <a href="#" class="hover:text-zinc-400">FAQ</a>
                    <a href="#" class="hover:text-zinc-400">Centre d'aide</a>
                    <a href="#" class="hover:text-zinc-400">Conditions d'utilisation</a>
                    <a href="#" class="hover:text-zinc-400">Confidentialité</a>
                </div>
            </div>
        </footer>

    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            // Clean interaction feedback without using alert()
            const form = document.getElementById('loginForm');
            
            const existingMsg = document.getElementById('successMsg');
            if (existingMsg) existingMsg.remove();

            const msg = document.createElement('div');
            msg.id = 'successMsg';
            msg.className = 'p-3 bg-emerald-600/20 border border-emerald-500 text-emerald-200 text-sm rounded-lg text-center';
            msg.innerText = `Connexion réussie pour ${email} (Mode démonstration)`;
            // redirect to Dashboardpage
            form.appendChild(msg);
        }
    </script>
</body>
</html>
